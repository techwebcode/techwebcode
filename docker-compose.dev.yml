# Local Development Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  mysql:
    ports:
      - "3306:3306"

  backend:
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development

  frontend:
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development

  admin:
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
