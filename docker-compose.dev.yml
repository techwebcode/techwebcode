# Local Development Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  mysql:
    ports:
      - "${MYSQL_HOST_PORT:-3600}:3306"

  backend:
    ports:
      - "${BACKEND_PORT:-8082}:8080"
    environment:
      APP_ENV: development

  frontend:
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development

  admin:
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
