# ==============================================================================
# TechWebCode Production Host Nginx Configuration
# Target Domains: techwebcode.in, www.techwebcode.in, admin.techwebcode.in
# Installation Path: /etc/nginx/sites-available/techwebcode
# Symlink: /etc/nginx/sites-enabled/techwebcode
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Main Website Domain (techwebcode.in & www.techwebcode.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name techwebcode.in www.techwebcode.in;

    client_max_body_size 20M;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # A. Go API Backend (Port 8082)
    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # B. Canonical Media Storage (Direct Host Filesystem Serving)
    location /media/ {
        alias /var/www/techwebcode-media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # C. Legacy Uploads Storage (Direct Host Filesystem Serving)
    location /uploads/ {
        alias /var/www/techwebcode-media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # D. Next.js Web Frontend (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 2. Admin Subdomain (admin.techwebcode.in)
# ------------------------------------------------------------------------------
