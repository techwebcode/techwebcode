# Production Docker Compose Setup (Pulls Pre-built Images from Docker Hub)
# Usage: DOCKER_USERNAME=yourusername docker compose -f docker-compose.prod.yml up -d

services:
  mysql:
    image: mysql:8.4
    container_name: techwebcode-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3600}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - techwebcode_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKER_USERNAME:-techwebcode}/techwebcode-backend:latest
    container_name: techwebcode-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_SECRET: ${ADMIN_SECRET}
      UPLOAD_PATH: ${UPLOAD_PATH:-/var/www/techwebcode-media}
    volumes:
      - ${MEDIA_HOST_PATH:-/var/www/techwebcode-media}:${UPLOAD_PATH:-/var/www/techwebcode-media}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8082}:8080"
    networks:
      - techwebcode_network

  frontend:
    image: ${DOCKER_USERNAME:-techwebcode}/techwebcode-frontend:latest
    container_name: techwebcode-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8080/api/v1}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - techwebcode_network

  admin:
    image: ${DOCKER_USERNAME:-techwebcode}/techwebcode-admin:latest
    container_name: techwebcode-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8080/api/v1}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:3001"
    networks:
      - techwebcode_network

volumes:
  mysql_data:

networks:
  techwebcode_network:
    driver: bridge
