services:
  # MySQL Database Service
  mysql:
    image: mysql:8.4
    container_name: techwebcode-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-techwebcode}
      MYSQL_USER: ${MYSQL_USER:-techwebcode}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root@123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root@123}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3600}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - techwebcode_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root@123}"]
      interval: 5s
      timeout: 3s
      retries: 15

  # Go Gin Backend API Service
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: techwebcode-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-techwebcode}
      MYSQL_USER: ${MYSQL_USER:-techwebcode}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root@123}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-techwebcode}
      DB_USER: ${MYSQL_USER:-techwebcode}
      DB_PASSWORD: ${MYSQL_PASSWORD:-root@123}
      ADMIN_SECRET: ${ADMIN_SECRET:-xL6Lwfl5GgKVBMl1ehHiZ1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      UPLOAD_PATH: ${UPLOAD_PATH:-/var/www/techwebcode-media}
    volumes:
      - media_data:${UPLOAD_PATH:-/var/www/techwebcode-media}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8082}:8080"
    networks:
      - techwebcode_network

  # Next.js Web Frontend Service
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    container_name: techwebcode-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      INTERNAL_API_URL: http://backend:8080/api/v1
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - techwebcode_network

  # Next.js Admin Dashboard Service
  admin:
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_ADMIN_SECRET: ${ADMIN_SECRET:-xL6Lwfl5GgKVBMl1ehHiZ1}
    container_name: techwebcode-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      INTERNAL_API_URL: http://backend:8080/api/v1
      ADMIN_SECRET: ${ADMIN_SECRET:-xL6Lwfl5GgKVBMl1ehHiZ1}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - techwebcode_network

volumes:
  mysql_data:
  media_data:

networks:
  techwebcode_network:
    driver: bridge