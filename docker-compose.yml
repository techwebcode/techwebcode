services:
  # MySQL Database Service
  mysql:
    image: mysql:8.4
    container_name: techwebcode-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3600}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - techwebcode_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 15

  # Go Gin Backend API Service
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: techwebcode-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      DB_USER: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET is required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      UPLOAD_PATH: ${UPLOAD_PATH:-/var/www/techwebcode-media}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@techwebcode.in}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - ${MEDIA_HOST_PATH:-/var/www/techwebcode-media}:${UPLOAD_PATH:-/var/www/techwebcode-media}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8082}:8080"
    networks:
      - techwebcode_network

  # Next.js Web Frontend Service
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8082/api/v1}
    container_name: techwebcode-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8082/api/v1}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8080/api/v1}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - techwebcode_network

  # Next.js Admin Dashboard Service
  admin:
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8082/api/v1}
    container_name: techwebcode-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8082/api/v1}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8080/api/v1}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:3001"
    networks:
      - techwebcode_network

volumes:
  mysql_data:

networks:
  techwebcode_network:
    driver: bridge